<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOXDSHORTS</title><link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000000; color: #ffffff; font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        nav { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); position: absolute; top: 0; z-index: 50; }
        .nav-title { text-transform: uppercase; letter-spacing: 0.05em; font-weight: 900; font-size: 22px; color: #ff4757; }
        .elite-input { padding: 10px 16px; background-color: #11141a; border: 1px solid #1f242e; color: #ffffff; font-size: 13px; font-family: monospace; width: 100%; }
        .elite-input:focus { border-color: #ff4757; outline: none; }
        .elite-btn { border: 1px solid #ff4757; background-color: #ff4757; text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 20px; font-size: 12px; font-weight: bold; cursor: pointer; color: #ffffff; border-radius: 4px; transition: all 0.2s; }
        .elite-btn:hover { background-color: transparent; color: #ff4757; }
        #link-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: #11141a; border: 1px solid #1f242e; padding: 32px; width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 16px; border-radius: 8px; }
        #shorts-container { width: 100%; height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
        #shorts-container::-webkit-scrollbar { display: none; }
        .short-section { width: 100%; height: 100vh; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; background-color: #0b0c10; }
        .short-wrapper { width: 100%; max-width: 90vh; aspect-ratio: 1/1; position: relative; display: flex; align-items: center; background-color: #000000; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .short-wrapper video, .short-wrapper iframe { width: 100%; height: 100%; border: none; object-fit: cover; cursor: pointer; }
        .short-overlay { position: absolute; bottom: 16px; left: 16px; right: 16px; z-index: 10; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); padding: 12px; border-radius: 4px; pointer-events: none; }
        .short-overlay h3 { font-size: 15px; font-weight: 800; text-transform: uppercase; margin-bottom: 2px; }
        .short-overlay p { font-size: 11px; color: #a1a1aa; font-family: monospace; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-title">🔥 BLOXDSHORTS</div>
        <button class="elite-btn" onclick="openModal()">Upload Short</button>
    </nav>
    <div id="link-modal">
        <div class="modal-content">
            <h2>Inject Bloxd Short</h2>
            <input type="text" id="stream-creator" placeholder="Creator Tag (e.g. Shahadah_Studios)..." class="elite-input">
            <input type="text" id="stream-title" placeholder="Short Title..." class="elite-input">
            <input type="text" id="stream-url" placeholder="Paste YouTube link or MP4/WebM URL..." class="elite-input">
            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                <button class="elite-btn" style="background:transparent; color:#ffffff; border-color:#1f242e;" onclick="closeModal()">Cancel</button>
                <button class="elite-btn" onclick="submitLink()">Publish</button>
            </div>
        </div>
    </div>
    <div id="shorts-container"></div>
    <script>
        const REPO = "Shahadah-studs/BloxdShorts";
        const TOKEN = "YOUR_GITHUB_PERSONAL_ACCESS_TOKEN";
        const container = document.getElementById('shorts-container');
        const openModal = () => document.getElementById('link-modal').style.display = 'flex';
        const closeModal = () => document.getElementById('link-modal').style.display = 'none';
        function handleVolume(vid) { if(vid.muted){ vid.muted=false; vid.currentTime=0; vid.play(); }else{ vid.paused?vid.play():vid.pause(); } }
        async function loadSharedLinks() {
            try {
                let res = await fetch(`https://githubusercontent.com{REPO}/main/database.json?t=${Date.now()}`);
                let links = res.ok ? await res.json() : [];
                container.innerHTML = links.length === 0 ? '<div class="short-section">No shorts in the cloud grid yet. Be the first!</div>' : "";
                links.reverse().forEach((item) => {
                    const section = document.createElement('div'); section.className = "short-section";
                    let embed = item.u.includes('.mp4') || item.u.includes('.mov') || item.u.includes('.webm') ? 
                        `<video src="${item.u}" loop autoplay muted playsinline onclick="handleVolume(this)"></video>` : 
                        `<iframe src="${item.u.replace('watch?v=', 'embed/').replace('youtu.be/', '://youtube.com')}?autoplay=1&mute=1&loop=1" allow="autoplay"></iframe>`;
                    section.innerHTML = `<div class="short-wrapper">${embed}<div class="short-overlay"><h3>${item.t}</h3><p>BY: @${item.c}</p></div></div>`;
                    container.appendChild(section);
                });
            } catch (e) { container.innerHTML = '<div class="short-section">No shorts in the cloud grid yet. Be the first!</div>'; }
        }
        async function submitLink() {
            let c = document.getElementById('stream-creator').value.trim() || 'Anonymous', t = document.getElementById('stream-title').value.trim(), u = document.getElementById('stream-url').value.trim();
            if (!t || !u) return;
            try {
                let url = `https://github.com{REPO}/contents/database.json`;
                let res = await fetch(url, { headers: { Authorization: `token ${TOKEN}` } }), sha = "", current = [];
                if (res.ok) { let data = await res.json(); sha = data.sha; current = JSON.parse(atob(data.content)); }
                current.push({ c, t, u });
                let update = await fetch(url, { method: "PUT", headers: { Authorization: `token ${TOKEN}`, "Content-Type": "application/json" }, body: JSON.stringify({ message: "Add short", content: btoa(JSON.stringify(current)), sha }) });
                if (update.ok) { closeModal(); loadSharedLinks(); }
            } catch (e) { alert("Pipeline connection error."); }
        }
        loadSharedLinks();
    </script>
</body>
</html>
